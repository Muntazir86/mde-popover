# FOSSA CLI configuration, used by .github/workflows/fossa.yml.
# https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
version: 3

project:
  # Fixed ID so every branch and fork reports to the same CLI project. CLI
  # uploads are stored as custom+<org id>/github.com/Muntazir86/mde-popover.
  id: github.com/Muntazir86/mde-popover
  name: Muntazir86/mde-popover
  url: https://github.com/Muntazir86/mde-popover

# Scan only the committed manifests: the workspace package.json and
# package-lock.json (the demo and the Angular versions the library is built
# and tested against) and the library's package.json (what npm consumers
# install: tslib plus the @angular peers). devDependencies (Nx, Vitest,
# ESLint, Playwright, Vite, ...) are build and test tooling and are left out,
# which is the CLI default (no --include-unused-deps).
paths:
  exclude:
    - ./dist
    - ./tmp
    - ./.nx
    - ./.angular
    - ./node_modules
