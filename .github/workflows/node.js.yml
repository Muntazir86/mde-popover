# Installs dependencies and builds the library and demo on pull requests and on
# pushes to master. Publishes the demo to the gh-pages branch only when commits
# land on master.

name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.14.0]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build library
        run: npm run build:prod
      - name: Build demo
        run: npm run build:demo

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build:prod
      - name: Deploy to gh-pages
        run: |
          set -euo pipefail
          if [[ $- == *x* ]]; then
            echo "Refusing to deploy with shell tracing enabled."
            exit 1
          fi
          # actions/checkout stored an Authorization header for GITHUB_TOKEN.
          # angular-cli-ghpages copies GH_TOKEN or GITHUB_TOKEN into the clone
          # URL and logs that URL, so hide those variables and authenticate with
          # the header instead.
          header="$(git config --local --get http.https://github.com/.extraheader)"
          printf '::add-mask::%s\n' "${header}"
          env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            -u PERSONAL_TOKEN \
            GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="${header}" \
            npm run deploy

  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.14.0]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/popper-test-e2e
          if-no-files-found: ignore
          retention-days: 7
