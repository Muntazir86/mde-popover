# Manual npm release. Pull requests and pushes do not start this workflow.
# Run it from the branch that owns the major: master for the current major, or a
# maintenance branch (10.x, 11.x, ...) for its own major. Type "publish" to
# confirm. The file is identical on every branch; Node.js comes from .nvmrc.
#
# Protected branches accept changes only through a pull request, so a bump is
# two runs:
#   patch / minor / conventional
#     Nx Release (`nx release [specifier] --skip-publish`, never also `--yes`)
#     bumps the version and changelog and commits that on a new branch. This
#     workflow opens a pull request into the branch it was run from and stops.
#     It does not push the protected branch, tag, create a GitHub release, or
#     stage on npm.
#   package-version (after that pull request is merged, or when package.json
#     already has the version)
#     Tags v{version}, creates the GitHub release, builds, and stages with
#     `npm stage publish`. A maintainer approves the staged version with 2FA.
#
# The workflow never publishes directly. See CONTRIBUTING.md.
#
# Authentication: trusted publishing (OIDC) configured as stage-only on npmjs.com
# for this workflow file. An optional NPM_TOKEN secret (granular token with
# "Read and write (stage only)") is used only when OIDC is not configured.
#
# mode:
#   package-version  release exactly the version in the library package.json
#                    (first release of a major, e.g. 11.0.0 from 11.x, or the
#                    run after a bump pull request is merged).
#                    Also use it to retry a run whose staging step failed.
#   patch / minor    open a pull request that bumps within the current major
#   conventional     open a pull request; conventional commits choose the bump
# Every mode fails if the result would leave the major in package.json, and a
# branch named N.x may only release major N (tools/release/resolve-release.mjs).
# The highest major on npm (or a new, higher one) is staged with the dist-tag
# "latest"; older majors get "vN-lts" (v10-lts, ...). The dist-tag is fixed at
# stage time. package-version marks the GitHub release latest only for the
# newest major.

name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to confirm. package-version tags and stages; other modes open a release PR."
        required: true
        type: string
      mode:
        description: "package-version tags and stages. patch, minor, and conventional open a release PR."
        required: true
        type: choice
        default: package-version
        options:
          - package-version
          - patch
          - minor
          - conventional

# pull-requests: write is not enough on its own. The repository must allow
# Actions to create pull requests: Settings → Actions → General →
# Workflow permissions → "Allow GitHub Actions to create and approve pull requests".
permissions:
  contents: write # release branch, tag, and GitHub release
  pull-requests: write # release pull request for patch, minor, and conventional
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in release builds
      - name: Install dependencies
        run: npm ci
      - name: Use npm 11.15+ (required for npm stage)
        # After npm ci, so dependencies install exactly as in CI.
        run: |
          npm install -g npm@^11.21.1
          npm --version
      - name: Git identity for the release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve and guard the version
        id: resolve
        run: node tools/release/resolve-release.mjs --mode "${{ github.event.inputs.mode }}"
      - name: Tag and GitHub release (package version)
        if: github.event.inputs.mode == 'package-version'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_EXISTS: ${{ steps.resolve.outputs.tag_exists }}
          GITHUB_LATEST: ${{ steps.resolve.outputs.github_latest }}
        run: |
          set -euo pipefail
          if [ "$TAG_EXISTS" != "true" ]; then
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node tools/release/resolve-release.mjs --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest="$GITHUB_LATEST"
          fi
      - name: Open a release pull request (bump)
        if: github.event.inputs.mode != 'package-version'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIER: ${{ steps.resolve.outputs.specifier }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="release/${BASE}-v${VERSION}"
          title="chore(release): publish ${VERSION}"

          summarize() {
            {
              echo "### Release pull request for ${VERSION}"
              echo ""
              echo "$1"
              echo ""
              echo "This run did not tag, create a GitHub release, or stage on npm."
              echo "After merging, run Release on \`${BASE}\` with mode **package-version** (type \`publish\`) to tag \`v${VERSION}\`, create the GitHub release, build, and stage on npm. Approve the staged package with 2FA."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          existing="$(gh pr list --base "$BASE" --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Release pull request already open: $existing"
            summarize "$existing"
            exit 0
          fi

          pr_body() {
            {
              printf '%s\n\n' "Bumps \`@muntazir/material-extended\` to **${VERSION}** on \`${BASE}\`."
              printf '%s\n\n' "This pull request is only the version bump and changelog. It does not create the \`v${VERSION}\` tag, the GitHub release, or an npm stage."
              printf '%s\n' "**Next step:** merge this pull request, then run the Release workflow on \`${BASE}\` with mode **package-version** (type \`publish\`). That run tags \`v${VERSION}\`, creates the GitHub release, builds the library, and stages the package on npm. Approve the staged package with 2FA."
            } > "$1"
            # Stop at the hand-written "# Changelog" heading so the body is only the new entry.
            if node tools/release/resolve-release.mjs --notes "$VERSION" | awk '/^# /{exit} {print}' > "$RUNNER_TEMP/notes.md"; then
              if [ -s "$RUNNER_TEMP/notes.md" ]; then
                {
                  echo ""
                  echo "## Changelog"
                  echo ""
                  cat "$RUNNER_TEMP/notes.md"
                } >> "$1"
              fi
            else
              echo "::warning::CHANGELOG.md has no parsed section for ${VERSION}; the pull request diff still contains it."
            fi
          }

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            closed="$(gh pr list --base "$BASE" --head "$branch" --state closed --json url --jq '.[0].url // empty')"
            if [ -n "$closed" ]; then
              echo "::error::Branch ${branch} already exists and its pull request is closed (${closed}). Refusing to force-push. Reopen that pull request or delete the branch, then run Release again."
              exit 1
            fi
            echo "Branch ${branch} exists with no pull request. Opening one without pushing."
            body="$RUNNER_TEMP/pr-body.md"
            pr_body "$body"
            url="$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$body")"
            echo "Opened $url"
            summarize "$url"
            exit 0
          fi

          git checkout -b "$branch"
          node tools/release/run-bump.mjs "$SPECIFIER"
          current="$(git branch --show-current)"
          if [ "$current" != "$branch" ]; then
            echo "::error::On ${current}, expected ${branch}. Refusing to push."
            exit 1
          fi
          # The branch ref only. No --tags and no --follow-tags.
          git push -u origin "HEAD:refs/heads/${branch}"

          body="$RUNNER_TEMP/pr-body.md"
          pr_body "$body"
          url="$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$body")"
          echo "Opened $url"
          summarize "$url"
      - name: Check the version on disk
        if: github.event.inputs.mode == 'package-version'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          actual="$(node -p "require('./libs/@muntazir/material-extended/package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json is $actual, expected $VERSION"
            exit 1
          fi
      - name: Build the library
        if: github.event.inputs.mode == 'package-version'
        run: npx nx build @muntazir/material-extended --configuration production --skip-nx-cache
      - name: Stage on npm (approve on npmjs.com with 2FA)
        if: github.event.inputs.mode == 'package-version'
        working-directory: dist/@muntazir/material-extended
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::dist package.json is $actual, expected $VERSION"
            exit 1
          fi
          npm stage publish --tag "$DIST_TAG" --access public --provenance
          {
            echo "### Staged ${{ steps.resolve.outputs.package }}@$VERSION (dist-tag: $DIST_TAG)"
            echo ""
            echo "Review and approve it with 2FA in the Staged Packages tab on npmjs.com,"
            echo "or run: npm stage list ${{ steps.resolve.outputs.package }} then npm stage approve <stage-id>"
          } >> "$GITHUB_STEP_SUMMARY"
