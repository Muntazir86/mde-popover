# Publishes the demo to the gh-pages branch after CI passes for a push to
# master. No other branch, and no pull request, deploys.
#
# workflow_run only uses the copy of this file on the default branch (master),
# so it is safe for the file to exist, unchanged, on maintenance branches.

name: Deploy demo

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build:prod
      - name: Build demo
        run: npm run build:demo
      - name: Deploy to gh-pages
        env:
          DEMO_DIR: dist/apps/popper-test/browser
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Plain git, authenticated by the header that actions/checkout stored
          # for GITHUB_TOKEN (persist-credentials). No token is put in a URL.
          test -f "$DEMO_DIR/index.html"
          cp "$DEMO_DIR/index.html" "$DEMO_DIR/404.html" # SPA fallback for deep links
          touch "$DEMO_DIR/.nojekyll"
          site="$RUNNER_TEMP/gh-pages"
          git fetch --no-tags --depth=1 origin gh-pages
          git worktree add --detach "$site" FETCH_HEAD
          find "$site" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$DEMO_DIR"/. "$site"/
          cd "$site"
          git add -A
          if git diff --cached --quiet; then
            echo "The demo on gh-pages is already up to date."
            exit 0
          fi
          git -c user.name="Ghulam Shabbir" -c user.email="ghulamshabbirmtn500@gmail.com" \
            commit --quiet -m "Deploy demo from ${SOURCE_SHA}"
          git push origin HEAD:refs/heads/gh-pages
