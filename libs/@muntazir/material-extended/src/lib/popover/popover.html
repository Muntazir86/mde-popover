<ng-template>
  <div
    class="mde-popover-panel"
    role="dialog"
    [class.mde-popover-overlap]="overlapTrigger"
    [ngClass]="_classList"
    [ngStyle]="popoverPanelStyles"
    (keydown)="_handleKeydown($event)"
    (click)="onClick()"
    (mouseover)="onMouseOver()"
    (mouseleave)="onMouseLeave()"
    [animate.enter]="disableAnimation ? '' : 'mde-popover-enter-animation'"
    [animate.leave]="disableAnimation ? '' : 'mde-popover-leave-animation'"
    >
    @if (!overlapTrigger) {
      <div
        class="mde-popover-direction-arrow"
        [ngStyle]="popoverArrowStyles"
      ></div>
    }
    <div
      class="mde-popover-content"
      [ngStyle]="popoverContentStyles"
      [cdkTrapFocus]="focusTrapEnabled"
      [cdkTrapFocusAutoCapture]="focusTrapAutoCaptureEnabled"
      >
      <ng-content></ng-content>
    </div>
  </div>
</ng-template>
