<div class="container" tabindex="-1" (keydown)="onItemKeydown($event)">
  @for (item of items; track item.className) {
    <button
      mat-button
      class="item"
      [attr.data-testid]="'theme-' + item.className"
      [attr.aria-label]="item.label"
      [ngStyle]="item.styles"
      [class.current]="theme() === item.className"
      (click)="theme.set(item.className)"
      [class.hover]="hovering !== null"
      (focus)="hovering = item.className"
      [attr.cdkFocusInitial]="theme() === item.className || null"
      (mouseenter)="hovering = item.className"
      (mouseleave)="hovering = null"
      >
      @if (theme() === item.className) {
        <mat-icon>check_circle</mat-icon>
      }
    </button>
  }
</div>
